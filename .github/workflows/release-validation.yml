name: Release validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Install exact tools and frozen dependencies
        run: |
          npm install --prefix .scratch/ci-tools --no-package-lock --ignore-scripts pnpm@12.9.1
          echo "$GITHUB_WORKSPACE/.scratch/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          .scratch/ci-tools/node_modules/.bin/pnpm install --frozen-lockfile
          node_modules/.bin/agent-browser install
          python3 -I -c 'import pty; print("Python PTY available")'
      - name: Record source and tools
        run: |
          mkdir -p .scratch/ci-evidence
          {
            git rev-parse HEAD
            sw_vers
            node --version
            pnpm --version
            node_modules/.bin/wrangler --version
            node_modules/.bin/vitest --version
            node_modules/.bin/agent-browser --version
            python3 --version
          } | tee .scratch/ci-evidence/tools.log
      - name: No known vulnerability at high severity or above
        run: pnpm audit --audit-level high 2>&1 | tee .scratch/ci-evidence/audit.log
      - name: Check all mutation anchors
        run: pnpm run mutate --check | tee .scratch/ci-evidence/anchors.log
      - name: Full typecheck and integration tests
        run: pnpm run check 2>&1 | tee .scratch/ci-evidence/check.log
      - name: Full uninterrupted mutation gate
        run: pnpm run mutate 2>&1 | tee .scratch/ci-evidence/mutate.log
      - name: Confirm restoration and rebuild the CLI
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code
          git diff --check
          pnpm run build:cli
      - name: Every local page under 50 ms at p95
        run: pnpm run bench 2>&1 | tee .scratch/ci-evidence/bench.log
      - name: Keep explicit synthetic validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ github.sha }}
          path: .scratch/ci-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
